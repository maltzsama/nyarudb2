name: Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy Documentation
    runs-on: macos-15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3.0'

      - name: Swift version
        run: swift --version

      - name: Build (symbol graphs)
        run: swift build -c release

      - name: Stage CHANGELOG as DocC article
        run: |
          cp ./CHANGELOG.md Sources/NyaruDB2/Documentation.docc/CHANGELOG.md

      - name: Generate Swift DocC static site
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation --target NyaruDB2 --output-path ./docs \
            --transform-for-static-hosting \
            --experimental-enable-custom-templates

      - name: Redirect site root to documentation landing
        run: |
          printf '%s' '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=/documentation/nyarudb2/">' \
            '<script src="https://cdn.counter.dev/script.js" data-id="2a2c5d2b-5c34-4212-be47-a2e658d11dbf" data-utcoffset="2"></script>' \
            '<title>NyaruDB2 Documentation</title></head>' \
            '<body>Redirecting to <a href="/documentation/nyarudb2/">documentation</a>.</body></html>' \
            > ./docs/index.html

      - name: Ensure analytics footer is present on every page
        run: |
          # Workaround for https://github.com/swiftlang/swift-docc/issues/1532
          ANALYTICS_MARKER='counter.dev/script.js'
          FOUND=0
          for f in $(find ./docs -name 'index.html'); do
            if grep -q "$ANALYTICS_MARKER" "$f"; then
              FOUND=$((FOUND+1))
            fi
          done
          echo "pages with analytics: $FOUND"
          if [ "$FOUND" -lt 1 ]; then
            echo "::error::No generated page contains the analytics footer (docc custom templates were not applied)."
            exit 1
          fi

      - name: Persist custom domain
        run: printf '%s' 'nyarudb2.galileostd.io' > ./docs/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4