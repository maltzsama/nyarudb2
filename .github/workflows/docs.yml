name: Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy Documentation
    runs-on: macos-15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3.0'

      - name: Swift version
        run: swift --version

      - name: Build (symbol graphs)
        run: swift build -c release

      - name: Generate Swift DocC static site
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation --target NyaruDB2 --output-path ./docs \
            --transform-for-static-hosting --hosting-base-path nyarudb2 \
            --experimental-enable-custom-templates

      - name: Build landing page from README
        run: |
          python3 -m pip install --user markdown
          mkdir -p ./docs/img
          cp ./img/nyaru.svg ./docs/img/nyaru.svg
          python3 Scripts/build-landing.py ./docs/index.html

      - name: Ensure analytics footer is present on every page
        run: |
          # Workaround for https://github.com/swiftlang/swift-docc/issues/1532
          ANALYTICS_MARKER='counter.dev/script.js'
          FOUND=0
          for f in $(find ./docs -name 'index.html'); do
            if grep -q "$ANALYTICS_MARKER" "$f"; then
              FOUND=$((FOUND+1))
            fi
          done
          echo "pages with analytics: $FOUND"
          if [ "$FOUND" -lt 1 ]; then
            echo "::error::No generated page contains the analytics footer (docc custom templates were not applied)."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4